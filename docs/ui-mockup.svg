    <path d="M322 337q23-18 46 0M423 337q23-18 46 0" fill="none" stroke="#473b4b" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="395" cy="387" rx="22" ry="28" fill="#653443" stroke="#9d6470" stroke-width="4"/>
    <ellipse cx="395" cy="392" rx="11" ry="13" fill="#f38a96"/>
    <circle cx="313" cy="369" r="11" fill="#ef929d" opacity=".8"/>
    <circle cx="476" cy="369" r="11" fill="#ef929d" opacity=".8"/>
  </g>
