<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Conceito da tela principal do OmaTuber</title>
  <desc id="description">À esquerda, o avatar de exemplo aparece com a boca aberta, modo ao vivo e miniaturas de Quieto e Falando. À direita, estados separados mostram OBS conectado, microfone ativo, boca falando, fonte visível na cena e um medidor com marca de sensibilidade.</desc>
  <defs>
    <pattern id="checks" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#283440"/>
      <rect width="16" height="16" fill="#33414c"/>
      <rect x="16" y="16" width="16" height="16" fill="#33414c"/>
    </pattern>
    <clipPath id="stage-clip"><rect x="54" y="185" width="682" height="350" rx="14"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".2"/>
    </filter>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #eef3f5; }
      .muted { fill: #aab7c2; }
      .small { font-size: 14px; }
      .body { font-size: 17px; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#0b1219"/>
  <rect x="30" y="26" width="48" height="48" rx="14" fill="#ff9a70"/>
  <path d="M42 49h7l5-10 6 20 5-10h7" fill="none" stroke="#17222c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="50" font-size="25" font-weight="800">OmaTuber</text>
  <text x="93" y="71" class="small muted">Seu avatar, pronto para aparecer no OBS</text>
  <rect x="895" y="31" width="119" height="36" rx="18" fill="#223b34"/>
  <circle cx="916" cy="49" r="5" fill="#8ee1af"/>
  <text x="930" y="54" class="small" fill="#c7f1d6">AO VIVO</text>
  <rect x="1026" y="31" width="144" height="36" rx="18" fill="#1a2832" stroke="#35505d"/>
  <text x="1045" y="54" class="small">OBS conectado</text>

  <rect x="30" y="109" width="730" height="618" rx="22" fill="#15212b" stroke="#2a3b47" filter="url(#shadow)"/>
  <text x="55" y="151" class="heading">Prévia do avatar</text>
  <text x="656" y="150" class="small muted">1:1</text>
  <rect x="54" y="185" width="682" height="350" rx="14" fill="url(#checks)"/>
  <g clip-path="url(#stage-clip)">
    <ellipse cx="394" cy="540" rx="173" ry="30" fill="#13202a" opacity=".34"/>
    <path d="M242 516c9-84 58-117 152-117s144 33 152 117" fill="#c16a7b" stroke="#512f46" stroke-width="7"/>
    <path d="M333 417q61 37 122 0l-13 89H347z" fill="#e89caa"/>
