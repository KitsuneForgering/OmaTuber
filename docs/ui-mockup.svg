  <circle cx="126" cy="626" r="34" fill="#f0b7b2"/>
  <path d="M103 618q9-7 18 0m12 0q9-7 18 0" fill="none" stroke="#473b4b" stroke-width="3" stroke-linecap="round"/>
  <path d="M119 636q8 6 16 0" fill="none" stroke="#653443" stroke-width="3" stroke-linecap="round"/>
  <text x="199" y="596" class="label muted">QUIETO</text>
  <text x="199" y="628" class="body">quieto.png</text>
  <text x="199" y="652" class="small muted">1024 × 1024</text>
  <rect x="391" y="558" width="345" height="143" rx="14" fill="#2c292e" stroke="#ff9a70" stroke-width="2"/>
  <rect x="406" y="574" width="112" height="110" rx="9" fill="url(#checks)"/>
  <circle cx="462" cy="626" r="34" fill="#f0b7b2"/>
  <path d="M439 618q9-7 18 0m12 0q9-7 18 0" fill="none" stroke="#473b4b" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="462" cy="640" rx="7" ry="9" fill="#653443"/>
  <text x="535" y="596" class="label" fill="#ffb08e">FALANDO</text>
  <text x="535" y="628" class="body">falando.png</text>
  <text x="535" y="652" class="small muted">Exibindo agora</text>

  <rect x="790" y="109" width="380" height="349" rx="22" fill="#15212b" stroke="#2a3b47"/>
  <text x="817" y="150" class="heading">O que está acontecendo</text>
  <text x="817" y="172" class="small muted">Cada etapa mostra seu próprio estado.</text>
  <path d="M839 211v177" stroke="#3d5660" stroke-width="3" stroke-dasharray="5 8"/>
  <circle cx="839" cy="212" r="17" fill="#244338" stroke="#65c29b"/>
