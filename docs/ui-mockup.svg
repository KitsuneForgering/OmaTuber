    <path d="M263 307 267 220q22-43 67 4l61 14 62-14q45-47 67-4l3 87" fill="#6c566a" stroke="#352c40" stroke-width="7"/>
    <path d="M283 230q13-37 48 4l-41 32zM500 230q-13-37-48 4l41 32z" fill="#f2a4ac"/>
    <ellipse cx="395" cy="341" rx="132" ry="118" fill="#f0b7b2" stroke="#6b4b5a" stroke-width="7"/>
