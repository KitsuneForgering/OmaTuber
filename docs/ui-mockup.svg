  <line x1="870" y1="303" x2="1141" y2="303" stroke="#30414d"/>
  <circle cx="839" cy="328" r="17" fill="#583b35" stroke="#ff9a70"/>
  <path d="M831 328h4l3-7 4 14 3-7h4" fill="none" stroke="#ffb08e" stroke-width="2" stroke-linejoin="round"/>
  <text x="870" y="324" class="body" font-weight="700">Boca aberta</text>
  <text x="870" y="345" class="small muted">Som acima da sensibilidade</text>
  <line x1="870" y1="361" x2="1141" y2="361" stroke="#30414d"/>
  <circle cx="839" cy="387" r="17" fill="#244338" stroke="#65c29b"/>
  <path d="m832 387 5 5 9-11" fill="none" stroke="#a6edc0" stroke-width="3" stroke-linecap="round"/>
  <text x="870" y="383" class="body" font-weight="700">Visível na cena Principal</text>
  <text x="870" y="404" class="small muted">Avatar adicionado ao OBS</text>
  <rect x="817" y="423" width="326" height="23" rx="10" fill="#253c33"/>
  <text x="833" y="440" class="small" fill="#b9eccd">Pronto para aparecer na transmissão</text>

  <rect x="790" y="475" width="380" height="252" rx="22" fill="#15212b" stroke="#2a3b47"/>
  <text x="817" y="516" class="heading">Sua voz</text>
  <text x="817" y="541" class="small muted">Yeti Nano</text>
  <text x="1095" y="541" class="small" fill="#ffb08e">-18 dB</text>
  <rect x="817" y="558" width="326" height="18" rx="9" fill="#273744"/>
  <rect x="817" y="558" width="238" height="18" rx="9" fill="#ff9a70"/>
  <line x1="977" y1="552" x2="977" y2="584" stroke="#f4f5d7" stroke-width="3"/>
  <text x="817" y="599" class="small muted">silêncio</text>
  <text x="932" y="599" class="small muted">marca</text>
  <text x="1090" y="599" class="small muted">alto</text>
  <text x="817" y="637" class="body">Sensibilidade</text>
  <line x1="946" y1="630" x2="1135" y2="630" stroke="#415765" stroke-width="5" stroke-linecap="round"/>
  <line x1="946" y1="630" x2="1023" y2="630" stroke="#ff9a70" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1023" cy="630" r="10" fill="#ffb08e" stroke="#6d3e35" stroke-width="3"/>
  <text x="817" y="675" class="small muted">A voz passou da marca e abriu a boca.</text>
  <rect x="817" y="687" width="326" height="28" rx="9" fill="#24313b"/>
  <text x="835" y="707" class="small">Testar boca</text>
  <text x="1015" y="707" class="small muted">Prévia apenas</text>

  <text x="32" y="769" class="small muted">CONCEITO VISUAL · Estados ilustrativos; a interface ainda será implementada.</text>
  <text x="986" y="769" class="small muted">Ajuda  ·  Ajustes</text>
</svg>
